<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Pocket Money" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Pocket Money</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: Georgia, serif; background: #f5f5f2; min-height: 100vh; padding-bottom: 60px; }

    .header { background: #1a1a1a; color: #fff; padding: 20px 24px 16px; text-align: center; }
    .header-sub { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; opacity: 0.5; margin-bottom: 4px; }
    .header-title { font-size: 26px; font-weight: bold; letter-spacing: -0.5px; }

    .tabs { display: flex; background: #1a1a1a; }
    .tab { flex: 1; padding: 12px 8px; border: none; cursor: pointer; background: transparent; color: #888; font-family: Georgia, serif; font-size: 15px; transition: all 0.2s; }

    .content { max-width: 480px; margin: 0 auto; padding: 0 16px 16px; }

    .name-row { padding-top: 20px; display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .name-title { flex: 1; font-size: 20px; font-weight: bold; color: #1a1a1a; }

    .card { background: #fff; border-radius: 14px; padding: 18px 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); margin-bottom: 14px; }
    .card-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #999; margin-bottom: 12px; }

    .monthly-row { display: flex; align-items: center; justify-content: space-between; }
    .monthly-total { font-size: 32px; font-weight: bold; color: #1a1a1a; }
    .monthly-sub { font-size: 13px; color: #888; margin-top: 2px; }
    .btn-monthly { padding: 10px 18px; border: none; border-radius: 10px; cursor: pointer; font-family: Georgia, serif; font-size: 14px; font-weight: bold; transition: all 0.2s; }
    .btn-monthly-sub { font-size: 11px; color: #aaa; margin-top: 4px; text-align: right; }

    .mini-cards { display: flex; gap: 8px; margin-top: 14px; }
    .mini-card { flex: 1; border-radius: 8px; padding: 8px 12px; }
    .mini-card-label { font-size: 11px; font-weight: bold; margin-bottom: 2px; }
    .mini-card-val { font-size: 18px; font-weight: bold; }

    .bar-row { margin-bottom: 12px; }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
    .bar-meta span:first-child { color: #555; }
    .bar-track { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }

    .chore-inputs { display: flex; gap: 8px; margin-bottom: 8px; }
    .amount-wrap { position: relative; flex: 0 0 90px; }
    .amount-prefix { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #888; font-size: 15px; pointer-events: none; }
    input[type="number"], input[type="text"], input[type="date"] {
      width: 100%; padding: 10px 8px 10px 22px; border: 1.5px solid #ddd; border-radius: 8px;
      font-family: Georgia, serif; font-size: 16px; outline: none; background: #fff;
      -webkit-appearance: none;
    }
    input[type="text"] { padding-left: 12px; font-size: 14px; }
    input[type="date"] { padding: 8px 10px; font-size: 13px; }
    .date-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .date-row label { font-size: 13px; color: #888; white-space: nowrap; }

    .pay-btns { display: flex; gap: 8px; }
    .btn-pay { flex: 1; padding: 11px 8px; border: none; border-radius: 10px; cursor: pointer; font-family: Georgia, serif; font-size: 14px; font-weight: bold; transition: all 0.2s; }

    .quick-btns { display: flex; gap: 8px; margin-bottom: 14px; }
    .btn-quick { flex: 1; padding: 8px 0; border: 1.5px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-family: Georgia, serif; font-size: 14px; color: #555; transition: all 0.15s; }

    .log-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #999; margin-bottom: 10px; padding-left: 4px; }
    .log-empty { text-align: center; color: #bbb; padding: 30px 0; font-size: 14px; font-style: italic; }
    .log-entry { display: flex; align-items: center; background: #fff; border-radius: 10px; padding: 11px 14px; margin-bottom: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .log-entry-text { flex: 1; }
    .log-entry-note { font-size: 14px; font-weight: bold; color: #1a1a1a; }
    .log-entry-date { font-size: 12px; color: #aaa; margin-top: 1px; }
    .log-entry-amt { font-size: 16px; font-weight: bold; margin-right: 10px; }
    .btn-remove { background: none; border: none; cursor: pointer; color: #ccc; font-size: 16px; padding: 2px 4px; font-family: Georgia, serif; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: #fff; padding: 12px 22px; border-radius: 30px; font-size: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 999; white-space: nowrap;
      animation: fadein 0.2s ease; pointer-events: none;
    }
    @keyframes fadein {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-sub">Family</div>
  <div class="header-title">Pocket Money</div>
</div>

<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>

<script>
  const KID_NAMES    = ["Alaina", "Morgan"];
  const MONTHLY_BASE = 30;
  const MAX_DAILY    = 2;
  const MAX_WEEKLY   = 5;
  const PALETTE      = [
    { accent: "#e8603c", light: "#fde8dc" },
    { accent: "#3c7be8", light: "#dceafd" },
  ];

  let state          = loadState();
  let activeTab      = 0;
  let selectedAmount = null;
  let toastTimer     = null;

  // ── Persistence ──────────────────────────────────────────────────────────────
  function defaultState() {
    return { kidNames: ["Alaina", "Morgan"], monthlyPaid: {}, choreLog: [] };
  }
  function loadState() {
    try {
      const raw = localStorage.getItem("pocketmoney-v2");
      return raw ? JSON.parse(raw) : defaultState();
    } catch { return defaultState(); }
  }
  function saveState() {
    try { localStorage.setItem("pocketmoney-v2", JSON.stringify(state)); } catch {}
  }

  // ── Date helpers ─────────────────────────────────────────────────────────────
  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }
  // Week key: Monday start
  function weekKey(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    const day = d.getDay(); // 0=Sun
    const diffToMon = (day === 0) ? -6 : 1 - day;
    d.setDate(d.getDate() + diffToMon);
    return d.toISOString().slice(0, 10);
  }
  function monthKey(dateStr) { return dateStr.slice(0, 7); }

  // ── Computed ─────────────────────────────────────────────────────────────────
  function choresToday(kidIndex, dateStr) {
    return state.choreLog
      .filter(e => e.kidIndex === kidIndex && e.date === dateStr)
      .reduce((s, e) => s + e.amount, 0);
  }
  function choresThisWeek(kidIndex, dateStr) {
    const wk = weekKey(dateStr);
    return state.choreLog
      .filter(e => e.kidIndex === kidIndex && weekKey(e.date) === wk)
      .reduce((s, e) => s + e.amount, 0);
  }
  function isMonthlyPaid(kidIndex) {
    return !!state.monthlyPaid[`${kidIndex}-${monthKey(todayStr())}`];
  }
  function choresThisMonth(kidIndex) {
    const mk = monthKey(todayStr());
    return state.choreLog
      .filter(e => e.kidIndex === kidIndex && monthKey(e.date) === mk)
      .reduce((s, e) => s + e.amount, 0);
  }
  function totalThisMonth(kidIndex) {
    return (isMonthlyPaid(kidIndex) ? MONTHLY_BASE : 0) + choresThisMonth(kidIndex);
  }

  // ── Actions ──────────────────────────────────────────────────────────────────
  function toggleMonthly(kidIndex) {
    const key = `${kidIndex}-${monthKey(todayStr())}`;
    if (state.monthlyPaid[key]) delete state.monthlyPaid[key];
    else state.monthlyPaid[key] = true;
    saveState(); render();
    showToast(state.monthlyPaid[key]
      ? `£30 marked as paid to ${state.kidNames[kidIndex]}`
      : `Monthly payment unmarked for ${state.kidNames[kidIndex]}`);
  }

  function addChore(kidIndex) {
    const amtEl  = document.getElementById("chore-amount");
    const noteEl = document.getElementById("chore-note");
    const dateEl = document.getElementById("chore-date");
    const amt    = parseFloat(amtEl.value);
    const dateStr = (dateEl && dateEl.value) ? dateEl.value : todayStr();

    if (!amt || amt <= 0)  return showToast("Enter a valid amount", "err");
    if (amt > MAX_DAILY)   return showToast(`Max £${MAX_DAILY} per day`, "err");

    const dayTotal  = choresToday(kidIndex, dateStr);
    const weekTotal = choresThisWeek(kidIndex, dateStr);

    if (dayTotal + amt > MAX_DAILY)
      return showToast(`Exceeds £${MAX_DAILY} daily limit — ${state.kidNames[kidIndex]} has £${dayTotal.toFixed(2)} today`, "err");
    if (weekTotal + amt > MAX_WEEKLY)
      return showToast(`Exceeds £${MAX_WEEKLY} weekly limit — ${state.kidNames[kidIndex]} has £${weekTotal.toFixed(2)} this week`, "err");

    state.choreLog.unshift({
      date: dateStr,
      kidIndex,
      amount: amt,
      note: (noteEl && noteEl.value.trim()) ? noteEl.value.trim() : "Chores"
    });
    saveState();
    amtEl.value  = "";
    if (noteEl) noteEl.value = "";
    selectedAmount = null;
    render();
    showToast(`+£${amt.toFixed(2)} added for ${state.kidNames[kidIndex]} ✓`);
  }

  function removeChore(idx) {
    state.choreLog.splice(idx, 1);
    saveState(); render();
    showToast("Entry removed");
  }

  // ── Toast ────────────────────────────────────────────────────────────────────
  function showToast(msg, type) {
    const existing = document.querySelector(".toast");
    if (existing) existing.remove();
    clearTimeout(toastTimer);
    const t = document.createElement("div");
    t.className   = "toast";
    t.style.background = (type === "err") ? "#c0392b" : "#1a1a1a";
    t.textContent = msg;
    document.body.appendChild(t);
    toastTimer = setTimeout(() => t.remove(), 2800);
  }

  // ── Render ───────────────────────────────────────────────────────────────────
  function render() {
    renderTabs();
    renderContent();
  }

  function renderTabs() {
    const el = document.getElementById("tabs");
    el.innerHTML = "";
    [0, 1].forEach(i => {
      const btn = document.createElement("button");
      btn.className = "tab";
      btn.textContent = state.kidNames[i];
      if (i === activeTab) {
        btn.style.background  = PALETTE[i].accent;
        btn.style.color       = "#fff";
        btn.style.fontWeight  = "bold";
      }
      btn.onclick = () => { activeTab = i; selectedAmount = null; render(); };
      el.appendChild(btn);
    });
  }

  function renderContent() {
    const pal      = PALETTE[activeTab];
    const ki       = activeTab;
    const name     = state.kidNames[ki];
    const dateStr  = todayStr();

    const dayUsed  = choresToday(ki, dateStr);
    const weekUsed = choresThisWeek(ki, dateStr);
    const dayPct   = Math.min(100, (dayUsed  / MAX_DAILY)  * 100);
    const weekPct  = Math.min(100, (weekUsed / MAX_WEEKLY) * 100);
    const paid     = isMonthlyPaid(ki);
    const total    = totalThisMonth(ki);
    const choresMo = choresThisMonth(ki);

    const logEntries = state.choreLog
      .map((e, i) => ({ ...e, idx: i }))
      .filter(e => e.kidIndex === ki)
      .slice(0, 50);

    document.getElementById("content").innerHTML = `

      <div class="name-row">
        <div class="name-title">${esc(name)}</div>
      </div>

      <!-- Monthly summary -->
      <div class="card">
        <div class="card-label">This Month</div>
        <div class="monthly-row">
          <div>
            <div class="monthly-total">£${total.toFixed(2)}</div>
            <div class="monthly-sub">total received</div>
          </div>
          <div>
            <button class="btn-monthly" id="btn-monthly"
              style="background:${paid ? pal.accent : "#eee"}; color:${paid ? "#fff" : "#555"}">
              ${paid ? "✓ £30 Paid" : "Mark £30 Paid"}
            </button>
            <div class="btn-monthly-sub">monthly base</div>
          </div>
        </div>
        <div class="mini-cards">
          <div class="mini-card" style="background:${pal.light}">
            <div class="mini-card-label" style="color:${pal.accent}">CHORES (MONTH)</div>
            <div class="mini-card-val">£${choresMo.toFixed(2)}</div>
          </div>
          <div class="mini-card" style="background:#f5f5f2">
            <div class="mini-card-label" style="color:#888">BASE</div>
            <div class="mini-card-val" style="color:#555">${paid ? "£30 ✓" : "£30 pending"}</div>
          </div>
        </div>
      </div>

      <!-- Limits -->
      <div class="card">
        <div class="card-label">Chore Limits</div>
        <div class="bar-row">
          <div class="bar-meta">
            <span>Today</span>
            <span style="font-weight:bold; color:${dayPct >= 100 ? "#c0392b" : "#1a1a1a"}">
              £${dayUsed.toFixed(2)} / £${MAX_DAILY}
            </span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${dayPct}%; background:${dayPct >= 100 ? "#c0392b" : pal.accent}"></div>
          </div>
        </div>
        <div class="bar-row">
          <div class="bar-meta">
            <span>This Week (Mon–Sun)</span>
            <span style="font-weight:bold; color:${weekPct >= 100 ? "#c0392b" : "#1a1a1a"}">
              £${weekUsed.toFixed(2)} / £${MAX_WEEKLY}
            </span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${weekPct}%; background:${weekPct >= 100 ? "#c0392b" : pal.accent}"></div>
          </div>
        </div>
      </div>

      <!-- Add chore pay -->
      <div class="card">
        <div class="card-label">Add Chore Pay</div>
        <div class="chore-inputs">
          <div class="amount-wrap">
            <span class="amount-prefix">£</span>
            <input type="number" id="chore-amount" min="0.5" max="2" step="0.5" placeholder="0.00" />
          </div>
          <input type="text" id="chore-note" placeholder="What did they do? (optional)" />
        </div>
        <div class="date-row">
          <label>Date:</label>
          <input type="date" id="chore-date" value="${dateStr}" />
        </div>
        <div class="pay-btns">
          <button class="btn-pay" id="btn-pay-0"
            style="background:${ki === 0 ? pal.accent : PALETTE[0].light}; color:${ki === 0 ? "#fff" : PALETTE[0].accent}">
            + Pay ${esc(state.kidNames[0])}
          </button>
          <button class="btn-pay" id="btn-pay-1"
            style="background:${ki === 1 ? pal.accent : PALETTE[1].light}; color:${ki === 1 ? "#fff" : PALETTE[1].accent}">
            + Pay ${esc(state.kidNames[1])}
          </button>
        </div>
      </div>

      <!-- Quick amounts -->
      <div class="quick-btns" id="quick-btns"></div>

      <!-- Log -->
      <div class="log-label">Chore Log — ${esc(name)}</div>
      ${logEntries.length === 0
        ? `<div class="log-empty">No chore payments recorded yet</div>`
        : logEntries.map(e => `
            <div class="log-entry">
              <div class="log-entry-text">
                <div class="log-entry-note">${esc(e.note || "Chores")}</div>
                <div class="log-entry-date">${e.date}</div>
              </div>
              <div class="log-entry-amt" style="color:${pal.accent}">+£${e.amount.toFixed(2)}</div>
              <button class="btn-remove" data-idx="${e.idx}">✕</button>
            </div>
          `).join("")
      }
    `;

    // Bind events
    document.getElementById("btn-monthly").onclick  = () => toggleMonthly(ki);
    document.getElementById("btn-pay-0").onclick     = () => addChore(0);
    document.getElementById("btn-pay-1").onclick     = () => addChore(1);
    document.querySelectorAll(".btn-remove").forEach(btn => {
      btn.onclick = () => removeChore(parseInt(btn.dataset.idx));
    });
    document.getElementById("chore-amount").addEventListener("input", () => {
      selectedAmount = null;
      renderQuickBtns();
    });

    renderQuickBtns();
  }

  function renderQuickBtns() {
    const pal = PALETTE[activeTab];
    const container = document.getElementById("quick-btns");
    if (!container) return;
    container.innerHTML = "";
    [0.5, 1, 1.5, 2].forEach(v => {
      const btn    = document.createElement("button");
      btn.className = "btn-quick";
      btn.textContent = `£${v}`;
      const isActive  = String(selectedAmount) === String(v);
      btn.style.borderColor = isActive ? pal.accent : "#ddd";
      btn.style.background  = isActive ? pal.light  : "#fff";
      btn.style.color       = isActive ? pal.accent : "#555";
      btn.style.fontWeight  = isActive ? "bold"     : "normal";
      btn.onclick = () => {
        selectedAmount = v;
        const amtEl = document.getElementById("chore-amount");
        if (amtEl) amtEl.value = v;
        renderQuickBtns();
      };
      container.appendChild(btn);
    });
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  render();
</script>
</body>
</html>
